<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Listing</title>

<style>
body{
    font-family:Arial,sans-serif;
    margin:20px;
    background:#f4f4f4;
}

h1{
    text-align:center;
}

.controls{
    text-align:center;
    margin-bottom:20px;
}

select{
    padding:10px;
    margin:10px;
}

#products{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:20px;
}

.card{
    width:220px;
    background:#fff;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.2);
    padding:15px;
    text-align:center;
}

.card img{
    width:100%;
    height:150px;
    border-radius:10px;
}

button{
    padding:8px 15px;
    border:none;
    background:#007BFF;
    color:white;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background:#0056b3;
}
</style>

</head>
<body>

<h1>Product Listing Page</h1>

<div class="controls">

<select id="category">
<option value="All">All Categories</option>
<option value="Electronics">Electronics</option>
<option value="Fashion">Fashion</option>
<option value="Books">Books</option>
</select>

<select id="sort">
<option value="default">Sort By</option>
<option value="low">Price: Low to High</option>
<option value="high">Price: High to Low</option>
<option value="rating">Highest Rating</option>
</select>

</div>

<div id="products"></div>

<script>

const products=[
{
name:"Laptop",
category:"Electronics",
price:55000,
rating:4.8,
image:"https://p1-ofp.static.pub//fes/cms/2025/08/11/urzxopamnfopyuk27rm04xdcv4jkda622518.png?width=584&height=584"
},
{
name:"Mobile",
category:"Electronics",
price:25000,
rating:4.5,
image:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSiuiOoGN_ZdSUEltzzYbuxb4DAI4_EHZhBUyRZ1CJLxQ&s=10"
},
{
name:"T-Shirt",
category:"Fashion",
price:700,
rating:4.1,
image:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQSG2z0S5MBSGfnbxgPGNcg9iDNVAefXVC6UEtu7K_DJw&s=10"
},
{
name:"Jeans",
category:"Fashion",
price:1200,
rating:4.4,
image:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRIy4F1jlj12aKHk9Ah4rS6nSwAejqRO0kX1trmsxzjoA&s=10"
},
{
name:"Java Book",
category:"Books",
price:500,
rating:4.9,
image:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQxIvU7yV07cdxFFNGJvfQW1MZdn0eGZfZrQP4W5LCqMg&s=10"
}
];

function showProducts(list){

let output="";

list.forEach(function(p){

output+=`
<div class="card">
<img src="${p.image}">
<h3>${p.name}</h3>
<p><b>${p.category}</b></p>
<p>₹${p.price}</p>
<p>⭐ ${p.rating}</p>
<button>Buy Now</button>
</div>
`;

});

document.getElementById("products").innerHTML=output;

}

showProducts(products);

function updateProducts(){

let category=document.getElementById("category").value;
let sort=document.getElementById("sort").value;

let filtered=[...products];

if(category!="All"){
filtered=filtered.filter(p=>p.category===category);
}

if(sort=="low"){
filtered.sort((a,b)=>a.price-b.price);
}

if(sort=="high"){
filtered.sort((a,b)=>b.price-a.price);
}

if(sort=="rating"){
filtered.sort((a,b)=>b.rating-a.rating);
}

showProducts(filtered);

}

document.getElementById("category").addEventListener("change",updateProducts);
document.getElementById("sort").addEventListener("change",updateProducts);

</script>

</body>
</html>
