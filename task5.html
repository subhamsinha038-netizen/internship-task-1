<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShopEasy - E-Commerce</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
}

header{
background:#222;
color:white;
padding:15px;
display:flex;
justify-content:space-between;
align-items:center;
position:sticky;
top:0;
}

header h2{
margin-left:20px;
}

nav a{
color:white;
text-decoration:none;
margin:0 10px;
}

.cart{
margin-right:20px;
font-weight:bold;
}

.hero{
background:linear-gradient(to right,#007bff,#00c6ff);
color:white;
text-align:center;
padding:60px 20px;
}

.hero h1{
font-size:40px;
margin-bottom:15px;
}

.hero p{
font-size:18px;
}

.controls{
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:15px;
margin:20px;
}

.controls input,
.controls select{
padding:10px;
font-size:16px;
width:250px;
border:1px solid #ccc;
border-radius:5px;
}

.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
gap:20px;
padding:20px;
}

.card{
background:white;
border-radius:10px;
padding:15px;
text-align:center;
box-shadow:0 0 10px rgba(0,0,0,.2);
transition:.3s;
}

.card:hover{
transform:scale(1.05);
}

.card img{
width:100%;
height:180px;
object-fit:cover;
border-radius:8px;
}

.card h3{
margin:10px 0;
}

.card p{
margin:6px 0;
}

button{
background:#007bff;
color:white;
border:none;
padding:10px 15px;
border-radius:5px;
cursor:pointer;
}

button:hover{
background:#0056b3;
}

footer{
background:#222;
color:white;
text-align:center;
padding:20px;
margin-top:30px;
}

@media(max-width:768px){

header{
flex-direction:column;
}

nav{
margin:10px 0;
}

.hero h1{
font-size:30px;
}

}
</style>
</head>

<body>

<header>
<h2>ShopEasy</h2>

<nav>
<a href="#">Home</a>
<a href="#">Products</a>
<a href="#">About</a>
<a href="#">Contact</a>
</nav>

<div class="cart">
🛒 Cart :
<span id="cartCount">0</span>
</div>

</header>

<section class="hero">
<h1>Welcome to ShopEasy</h1>
<p>Find the Best Products at the Best Prices</p>
</section>

<div class="controls">

<input
type="text"
id="search"
placeholder="Search Product...">

<select id="category">

<option value="All">
All Categories
</option>

<option value="Electronics">
Electronics
</option>

<option value="Fashion">
Fashion
</option>

<option value="Books">
Books
</option>

</select>

</div>

<div class="products" id="productContainer">

</div>

<footer>

<p>
© 2026 ShopEasy.
All Rights Reserved.
</p>

</footer>

<script>

    const products = [
{
name:"Laptop",
category:"Electronics",
price:55000,
image:"https://encrypted-tbn1.gstatic.com/shopping?q=tbn:ANd9GcT_rWFTXHCrxIXoy-KSAk6nbbqFhF4NAnx45wJKJqEqpXVlEaIYqPxnmvX1OavX1gHKieFBWYuvuCQivBIAizjiOYc_AM_QrPs6hS_1VL0FHKYQ_wcHum4ib90XC_M_y1dM_wViwQ0Gpw&usqp=CAc"
},
{
name:"Smartphone",
category:"Electronics",
price:25000,
image:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTEEX3Tfl8zTo1v-prOlOrqf2wEDocNFRWJyvfM-mXBFQ&s"
},
{
name:"Headphones",
category:"Electronics",
price:3500,
image:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTC4mrKrL-9gDkAwrDP53EvbmCvVWSriIw1xxxbiVwP_w&s"
},
{
name:"T-Shirt",
category:"Fashion",
price:799,
image:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQSG2z0S5MBSGfnbxgPGNcg9iDNVAefXVC6UEtu7K_DJw&s=10"
},
{
name:"Jeans",
category:"Fashion",
price:1499,
image:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRIy4F1jlj12aKHk9Ah4rS6nSwAejqRO0kX1trmsxzjoA&s=10"
},
{
name:"Sneakers",
category:"Fashion",
price:2999,
image:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTYqO8IEVWyFF9L8gDTEqb7tFrWxafOwfEKri_mEruiOg&s=10"
}
];

let cart=0;

function displayProducts(list){

const container=document.getElementById("productContainer");

container.innerHTML="";

list.forEach(function(product){

container.innerHTML+=`
<div class="card">

<img src="${product.image}">

<h3>${product.name}</h3>

<p><b>${product.category}</b></p>

<p>₹ ${product.price}</p>

<button onclick="addToCart()">
Add to Cart
</button>

</div>
`;

});

}

displayProducts(products);

function addToCart(){

cart++;

document.getElementById("cartCount").innerText=cart;

}

function filterProducts(){

let search=document.getElementById("search").value.toLowerCase();

let category=document.getElementById("category").value;

let filtered=products.filter(function(product){

let matchName=product.name.toLowerCase().includes(search);

let matchCategory=(category==="All" || product.category===category);

return matchName && matchCategory;

});

displayProducts(filtered);

}

document.getElementById("search").addEventListener("keyup",filterProducts);

document.getElementById("category").addEventListener("change",filterProducts);

</script>

</body>
</html>
